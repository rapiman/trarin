name: pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    name: ${{ matrix.sistema }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.sistema }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {sistema: ubuntu-latest, python: "3.10"}
          - {sistema: ubuntu-latest, python: "3.12"}
          - {sistema: ubuntu-latest, python: "3.13"}
          - {sistema: windows-latest, python: "3.12"}
          - {sistema: macos-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar trarin con el servidor MCP
        run: python -m pip install -e ".[mcp]"
      - name: La ayuda no se cae
        run: python -m trarin --help
      - name: Pruebas
        run: python -m unittest discover -s pruebas -v

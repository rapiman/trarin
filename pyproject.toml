[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trarin"
version = "0.1.0"
description = "Lee y escribe sesiones de Pro Tools, Ableton Live y FL Studio como texto, para armar shows; con servidor MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = {text = "LGPL-2.1-or-later"}
keywords = ["pro tools", "ptx", "ableton", "fl studio", "daw", "mcp", "audio", "midi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Repositorio = "https://github.com/rapiman/trarin"

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
mcp = ["mcp"]
audio = ["numpy", "soxr"]
mp3 = ["lameenc"]
todo = ["pyyaml>=6", "mcp", "numpy", "soxr", "lameenc"]

[project.scripts]
trarin = "trarin.__main__:main"

[tool.setuptools.packages.find]
include = ["trarin*"]

[tool.setuptools.package-data]
trarin = ["plantillas/*.json", "plantillas/*.ptx"]
